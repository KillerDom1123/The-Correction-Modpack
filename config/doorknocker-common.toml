
#==========================================
#Door Knocker Mod Configuration
#==========================================
[doorknocker]

	#========== TIMING SETTINGS ==========
	#20 ticks = 1 second, 1200 ticks = 1 minute
	[doorknocker.timing]
		#Minimum delay during DAY (ticks)
		#Range: 20 ~ 288000
		dayMinTicks = 48000
		#Maximum delay during DAY (ticks)
		#Range: 20 ~ 288000
		dayMaxTicks = 96000
		#Minimum delay during NIGHT (ticks)
		#Range: 20 ~ 288000
		nightMinTicks = 24000
		#Maximum delay during NIGHT (ticks)
		#Range: 20 ~ 288000
		nightMaxTicks = 48000

	#========== DISTANCE SETTINGS ==========
	[doorknocker.distance]
		#Minimum distance during DAY (blocks)
		#Range: 0 ~ 128
		dayMinDistance = 0
		#Maximum distance during DAY (blocks)
		#Range: 1 ~ 128
		dayMaxDistance = 32
		#Minimum distance during NIGHT (blocks)
		#Range: 0 ~ 128
		nightMinDistance = 0
		#Maximum distance during NIGHT (blocks)
		#Range: 1 ~ 128
		nightMaxDistance = 48

	#========== CHANCE SETTINGS ==========
	[doorknocker.chance]
		#Chance door will open (0.0-1.0)
		#Range: 0.0 ~ 1.0
		openChance = 0.1

	#========== OTHER SETTINGS ==========
	[doorknocker.misc]
		#Require line of sight to door
		requireDirectLineOfSight = false
		#Enable debug logging
		enableDebugLogging = false

	#Independent trapdoor events. Existing door sections remain unchanged.
	[doorknocker.trapdoors]
		enabled = true
		#Range: 0.0 ~ 1.0
		openChance = 0.1
		#Range: 20 ~ 288000
		dayMinTicks = 24000
		#Range: 20 ~ 288000
		dayMaxTicks = 48000
		#Range: 20 ~ 288000
		nightMinTicks = 12000
		#Range: 20 ~ 288000
		nightMaxTicks = 24000
		#Range: 0 ~ 128
		dayMinDistance = 0
		#Range: 1 ~ 128
		dayMaxDistance = 32
		#Range: 0 ~ 128
		nightMinDistance = 0
		#Range: 1 ~ 128
		nightMaxDistance = 48
		requireDirectLineOfSight = false

