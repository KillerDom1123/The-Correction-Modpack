modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "spooky_pregen"
version = "1.1.0"
displayName = "Spooky Dookie pre-generation scheduler"
authors = "Spooky Dookie pack"
# No network channels or registry entries; it only acts on a dedicated server.
displayTest = "IGNORE_ALL_VERSION"
description = '''
Runs Chunky while the dedicated server is empty and pauses it the moment a player logs in.
Works through a list of points (each grown from radius to maxRadius), then the edges of the generated area.
Configured in config/spooky_pregen.json; /pregen status|next|hold|resume|skip|reload.
'''

[[dependencies.spooky_pregen]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.spooky_pregen]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.spooky_pregen]]
modId = "chunky"
mandatory = true
versionRange = "[1.3,)"
ordering = "AFTER"
side = "BOTH"
